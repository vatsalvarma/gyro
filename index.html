<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🌴 Jungle 360 Walk</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"/>

  <style>
    body { margin: 0; font-family: Arial; }
    #panorama {
      width: 100vw;
      height: 100vh;
    }

    /* Gyro button */
    #gyroBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 999;
      padding: 10px 15px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<button id="gyroBtn">Enable Gyroscope</button>

<div id="panorama"></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>

<script>
const viewer = pannellum.viewer('panorama', {
    "default": {
        "firstScene": "scene1",
        "autoLoad": true,
        "sceneFadeDuration": 1000
    },

    "orientationOnByDefault": true, // 🔥 enables gyro

    "scenes": {

        "scene1": {
            "title": "🌳 Jungle Entrance",
            "panorama": "BEDROOM.jpg",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 320,
                    "type": "scene",
                    "text": "Go deeper 🌿",
                    "sceneId": "scene2"
                }
            ]
        },

        "scene2": {
            "title": "🌴 Deep Jungle",
            "panorama": "BEDROOM TWO.jpg",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": -90,
                    "type": "scene",
                    "text": "Go back",
                    "sceneId": "scene1"
                },
                {
                    "pitch": 5,
                    "yaw": -130,
                    "type": "scene",
                    "text": "Go to river 🌊",
                    "sceneId": "scene3"
                }
            ]
        },

        "scene3": {
            "title": "🏞 Jungle River",
            "panorama": "https://pannellum.org/images/bma-1.jpg",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 180,
                    "type": "scene",
                    "text": "Return 🌿",
                    "sceneId": "scene2"
                }
            ]
        }

    }
});


// 📱 iOS Gyroscope Permission Fix
document.getElementById("gyroBtn").addEventListener("click", function () {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {

        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') {
                    viewer.startOrientation(); // start gyro
                    alert("Gyroscope Enabled ✅");
                } else {
                    alert("Permission denied ❌");
                }
            })
            .catch(console.error);
    } else {
        // Android - no permission needed
        viewer.startOrientation();
        alert("Gyroscope Enabled ✅");
    }
});
</script>

</body>
</html>
